<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="rzc156 — Embodied AI · Robot Learning · WAM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0d1f16"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d353"/>
      <stop offset="50%" stop-color="#56d4dd"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="994" height="234" rx="14" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="3" y="3" width="994" height="34" rx="14" fill="#161b22"/>
  <rect x="3" y="23" width="994" height="14" fill="#161b22"/>
  <line x1="3" y1="37" x2="997" y2="37" stroke="#30363d" stroke-width="1"/>
  <circle cx="28" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="20" r="6" fill="#27c93f"/>
  <text x="94" y="25" font-size="13" fill="#8b949e">rzc156@github — zsh — 120×34</text>

  <!-- prompt line 1 -->
  <text x="32" y="74" font-size="17" fill="#8b949e">
    <tspan fill="#39d353">rzc156@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#56d4dd">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#c9d1d9">whoami</tspan>
  </text>

  <!-- big name -->
  <text x="32" y="140" font-size="62" font-weight="700" fill="#39d353" filter="url(#glow)" letter-spacing="2">rzc156</text>
  <text x="366" y="138" font-size="30" font-weight="600" fill="#c9d1d9">·</text>
  <text x="392" y="140" font-size="34" font-weight="600" fill="#56d4dd">&lt;OuO&gt;</text>

  <!-- tagline -->
  <text x="32" y="182" font-size="20" fill="#c9d1d9">
    Embodied AI · Robot Learning · <tspan fill="#39d353">VLA</tspan> · <tspan fill="#39d353">WAM</tspan>
  </text>
  <text x="32" y="212" font-size="16" fill="#8b949e">
    World Action Model — imagine in latent space, then turn it into supervision.
  </text>

  <!-- blinking cursor -->
  <text x="700" y="212" font-size="16" fill="#39d353">▋<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></text>
