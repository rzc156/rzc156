# Self-hosted GitHub stats cards.
# Runs on GitHub runners and commits SVG files into the repo, so the profile
# needs no third-party (vercel) host at render time.
name: metrics

on:
  schedule:
    - cron: "0 3 * * *"      # daily 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── main stats card
      #    base 只保留 header（avatar/name/joined/followers/repos）与语言，
      #    刻意去掉 activity / community / repositories 三段 —— 它们会显示
      #    大量为 0 的计数（PR、issue、releases、packages、sponsors …）。
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.base.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 15

      # ── contribution calendar (replaces the vercel activity-graph)
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.isocalendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Shanghai
