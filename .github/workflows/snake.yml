# 自托管「贡献贪吃蛇」：由 scripts/snake_svg.py 生成 assets/snake.svg。
# 蛇按蛇形顺序穿过绿墙，每吃掉一个贡献格就长一节。
# 生成后提交回 main，经 jsDelivr 分发，不依赖任何第三方服务。
name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *"      # 每 12h 刷新一次
  workflow_dispatch:             # 支持手动触发

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate snake svg
        run: python3 scripts/snake_svg.py --user rzc156 --out assets/snake.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: update contribution snake [skip ci]"
            git push
          fi
