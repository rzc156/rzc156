# Generates the contribution snake (dark) used in the profile README.
# Requires the profile repo to have Actions enabled.
name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12h
  workflow_dispatch:             # allow manual run
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: rzc156
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39d353&color_dots=#0d2818,#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
